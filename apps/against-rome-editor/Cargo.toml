[package]
name = "against-rome-editor-app"
version = "0.1.0"
edition = "2021"
description = "Against Rome Native Rust Desktop Map Editor"

[lib]
name = "against_rome_editor_app"
path = "src/lib.rs"

[[bin]]
name = "against-rome-editor"
path = "src/main.rs"

[dependencies]
against-rome-editor = { path = "../../native/against-rome-editor" }
against-rome-modifier = { path = "../../native/against-rome-modifier" }
against-rome-saves = { path = "../../native/against-rome-saves" }
against-rome-navigation = { path = "../../native/against-rome-navigation" }
against-rome-data = { path = "../../native/against-rome-data" }
against-rome-placement = { path = "../../native/against-rome-placement" }
against-rome-scenario = { path = "../../native/against-rome-scenario" }
against-rome-textures = { path = "../../native/against-rome-textures" }
serde_json = "1"
eframe = "0.27"
uuid = { version = "1", features = ["v4"] }
