[package]
name = "formation-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust port of tools/re/formation-probe: formation layout sampling, ALR soldier extraction, and PFIL inspection."

[lib]
name = "formation_probe"
path = "src/lib.rs"

[[bin]]
name = "formation-probe-rs"
path = "src/main.rs"

[dependencies]
against-rome-data = { path = "../../../native/against-rome-data" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
