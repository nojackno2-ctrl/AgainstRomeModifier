[package]
name = "shad-probe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "shad_probe"

[[bin]]
name = "shad-probe-rs"
path = "src/main.rs"

[dependencies]
against-rome-environment = { path = "../../../native/against-rome-environment" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
png = "0.17"

