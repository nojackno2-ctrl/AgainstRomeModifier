[package]
name = "anim-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Read-only ALR/APT animation contact sheets; C# anim-probe parity."

[dependencies]
against-rome-data = { path = "../../../native/against-rome-data" }
png = "=0.17.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
