name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore AgainstRomeModifier.slnx

      - name: Build and Test
        run: |
          dotnet build AgainstRomeModifier.slnx --configuration Release -p:PlatformTarget=x64 --no-restore -warnaserror
          dotnet test tests/AgainstRomeModifier.Tests/AgainstRomeModifier.Tests.csproj --configuration Release -p:PlatformTarget=x64 --no-build --no-restore

      - name: Publish Single-File Executable
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { "${{ inputs.tag }}" } else { $env:GITHUB_REF_NAME }
          $tag = $tag.Trim()
          $version = $tag.TrimStart('v')

          $distDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\release'
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null

          dotnet publish src.Modifier\AgainstRomeModifier.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $distDir

          # Clean XML files
          Get-ChildItem -Path $distDir -Filter "*.xml" -Recurse | Remove-Item -Force

          # Create ZIP archive
          $zipName = "AgainstRomeModifier_${tag}_win-x64.zip"
          $zipPath = Join-Path $distDir $zipName
          Compress-Archive -Path (Join-Path $distDir 'AgainstRomeModifier.exe') -DestinationPath $zipPath -Force

          # Checksums
          $exePath = Join-Path $distDir 'AgainstRomeModifier.exe'
          $hashExe = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash
          $hashZip = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash

          $checksums = "$hashExe  AgainstRomeModifier.exe`n$hashZip  $zipName"
          $sumPath = Join-Path $distDir 'SHA256SUMS.txt'
          Set-Content -LiteralPath $sumPath -Value $checksums -Encoding utf8

          Add-Content -Path $env:GITHUB_ENV -Value "TAG_NAME=$tag"
          Add-Content -Path $env:GITHUB_ENV -Value "DIST_DIR=$distDir"

      - name: Create or Update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG_NAME
          $dist = $env:DIST_DIR
          $exe = Join-Path $dist 'AgainstRomeModifier.exe'
          $zip = (Get-ChildItem -Path $dist -Filter "AgainstRomeModifier_*_win-x64.zip").FullName
          $sums = Join-Path $dist 'SHA256SUMS.txt'

          $exists = gh release view $tag --repo ${{ github.repository }} 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Updating existing release $tag..."
            gh release upload $tag $exe $zip $sums --clobber --repo ${{ github.repository }}
            gh release edit $tag --draft=false --latest --repo ${{ github.repository }}
          } else {
            Write-Host "Creating new release $tag..."
            gh release create $tag $exe $zip $sums `
              --repo ${{ github.repository }} `
              --title "⚔️ Against Rome Modifier $tag - 官方正式版" `
              --generate-notes
          }
