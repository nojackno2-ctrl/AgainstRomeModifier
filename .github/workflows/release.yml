name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v1.2.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore AgainstRomeModifier.slnx --configfile NuGet.Config
          dotnet restore src.Modifier\AgainstRomeModifier.csproj -r win-x64 --configfile NuGet.Config -p:IncludeBackupZip=false

      - name: Build and Test
        run: |
          dotnet build AgainstRomeModifier.slnx --configuration Release -p:PlatformTarget=x64 -p:IncludeBackupZip=false --no-restore -warnaserror
          dotnet test tests/AgainstRomeModifier.Tests/AgainstRomeModifier.Tests.csproj --configuration Release -p:PlatformTarget=x64 -p:IncludeBackupZip=false --no-build --no-restore

      - name: Validate tag against project version
        shell: pwsh
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:DISPATCH_TAG } else { $env:GITHUB_REF_NAME }
          $tag = $tag.Trim()
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tag must be vMAJOR.MINOR.PATCH; got '$tag'."
          }
          $tagVersion = $Matches.version

          $projectVersion = (& dotnet msbuild src.Modifier\AgainstRomeModifier.csproj `
            -getProperty:Version `
            -p:Configuration=Release `
            -p:IncludeBackupZip=false).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read the project version."
          }
          if ($tagVersion -ne $projectVersion) {
            throw "Tag version $tagVersion does not match project version $projectVersion."
          }

          Add-Content -Path $env:GITHUB_ENV -Value "TAG_NAME=$tag"
          Add-Content -Path $env:GITHUB_ENV -Value "PROJECT_VERSION=$projectVersion"

      - name: Verify release identity is unused
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $releaseProbe = @(gh api "repos/$env:RELEASE_REPOSITORY/releases/tags/$env:TAG_NAME" 2>&1)
          $releaseExit = $LASTEXITCODE
          if ($releaseExit -eq 0) {
            throw "Release $env:TAG_NAME already exists; refusing to replace published assets."
          }
          if (($releaseProbe -join "`n") -notmatch 'HTTP 404') {
            throw "Unable to prove release $env:TAG_NAME is unused: $($releaseProbe -join ' ')"
          }

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            git ls-remote --exit-code --tags origin "refs/tags/$env:TAG_NAME" | Out-Null
            $tagExit = $LASTEXITCODE
            if ($tagExit -eq 0) {
              throw "Tag $env:TAG_NAME already exists; refusing to attach this commit's assets to another ref."
            }
            if ($tagExit -ne 2) {
              throw "Unable to prove tag $env:TAG_NAME is unused (git ls-remote exit $tagExit)."
            }
          } elseif ($env:GITHUB_REF_NAME -ne $env:TAG_NAME) {
            throw "Pushed tag '$env:GITHUB_REF_NAME' does not match resolved tag '$env:TAG_NAME'."
          }
          exit 0

      - name: Publish Single-File Executable
        shell: pwsh
        run: |
          $tag = $env:TAG_NAME
          $version = $env:PROJECT_VERSION

          $distDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\release'
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null

          dotnet publish src.Modifier\AgainstRomeModifier.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeBackupZip=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $distDir

          # Clean XML files
          Get-ChildItem -Path $distDir -Filter "*.xml" -Recurse | Remove-Item -Force

          # Create ZIP archive
          $zipName = "AgainstRomeModifier_${tag}_win-x64.zip"
          $zipPath = Join-Path $distDir $zipName
          Compress-Archive -Path (Join-Path $distDir 'AgainstRomeModifier.exe') -DestinationPath $zipPath -Force

          & tools\Test-ReleaseArtifacts.ps1 `
            -ArtifactDirectory $distDir `
            -ArchivePath $zipPath `
            -AssemblyPath 'src.Core\bin\Release\net8.0-windows\AgainstRome.Core.dll' `
            -ExpectedVersion $version

          # Checksums
          $exePath = Join-Path $distDir 'AgainstRomeModifier.exe'
          $hashExe = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash
          $hashZip = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash

          $checksums = "$hashExe  AgainstRomeModifier.exe`n$hashZip  $zipName"
          $sumPath = Join-Path $distDir 'SHA256SUMS.txt'
          Set-Content -LiteralPath $sumPath -Value $checksums -Encoding utf8

          Add-Content -Path $env:GITHUB_ENV -Value "DIST_DIR=$distDir"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $tag = $env:TAG_NAME
          $dist = $env:DIST_DIR
          $exe = Join-Path $dist 'AgainstRomeModifier.exe'
          $zip = (Get-ChildItem -Path $dist -Filter "AgainstRomeModifier_*_win-x64.zip").FullName
          $sums = Join-Path $dist 'SHA256SUMS.txt'

          gh release create $tag $exe $zip $sums `
            --repo $env:RELEASE_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Against Rome Modifier $tag" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE."
          }
