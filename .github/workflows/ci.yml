name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AgainstRomeModifier.slnx

      # -warnaserror 讓分析器警告（含 IDE0005 多餘 using、IDE0051/0052 死碼）
      # 直接擋下 CI。規則嚴重度見根目錄 .editorconfig，分析器開關見 Directory.Build.props。
      - name: Build Release x64
        run: dotnet build AgainstRomeModifier.slnx --configuration Release -p:PlatformTarget=x64 --no-restore -warnaserror

      - name: Test
        run: dotnet test tests/AgainstRomeModifier.Tests/AgainstRomeModifier.Tests.csproj --configuration Release -p:PlatformTarget=x64 --no-build --no-restore
