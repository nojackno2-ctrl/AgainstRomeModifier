[package]
name = "against-rome-environment"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pure Rust environment, ecology noise, flora scatter, wild lair and settlement fairness engine"

[dependencies]
against-rome-editor = { path = "../against-rome-editor" }
against-rome-data = { path = "../against-rome-data" }
encoding_rs = "0.8"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
