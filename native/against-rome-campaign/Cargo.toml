[package]
name = "against-rome-campaign"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pure Rust AI archetypes, campaign compiler, objectives graph & sandbox, and cinematics engine"

[dependencies]
against-rome-scenario = { path = "../against-rome-scenario" }
against-rome-data = { path = "../against-rome-data" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
encoding_rs = "0.8"
