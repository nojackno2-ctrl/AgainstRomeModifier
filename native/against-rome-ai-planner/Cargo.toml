[package]
name = "against-rome-ai-planner"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pure Rust AI map planning, editor operator and placement formation layouts for Against Rome"

[dependencies]
against-rome-editor = { path = "../against-rome-editor" }
against-rome-textures = { path = "../against-rome-textures" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
