[package]
name = "against-rome-textures"
version = "0.1.0"
edition = "2021"
description = "Native Rust terrain textures document, blend authoring map, and transactional edit session"
publish = false

[dependencies]
against-rome-data = { path = "../against-rome-data" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"

[[bin]]
name = "ar-textures"
path = "src/bin/ar-textures.rs"
